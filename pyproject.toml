[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-grc-platform"
version = "0.1.0"
description = "Cybersecurity GRC & Compliance Platform - SOC 2 vs ISO 27001 vs NIST CSF 2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
